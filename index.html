
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning de nettoyage des postes - Heineken</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
    --green: #007A35;
    --dark: #004B27;
    --deep: #00391F;
    --red: #E32636;
    --gold: #D5B45B;
    --cream: #F5F7F2;
    --ink: #18382A;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 12px;
    background: #102b20;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 18px;
}

/* BOUTON EXPORT */

.toolbar {
    display: flex;
    justify-content: center;
}

button {
    border: 0;
    border-radius: 30px;
    padding: 13px 25px;
    background: white;
    color: var(--dark);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 20px #0005;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    background: #e9f4ec;
}

button:disabled {
    opacity: .6;
    cursor: wait;
}

/* AFFICHETTE 15 x 15 CM */

#poster {
    width: 150mm;
    height: 150mm;
    padding: 5mm;
    overflow: hidden;
    position: relative;
    background:
        radial-gradient(circle at 90% 5%, #ffffff16, transparent 25%),
        linear-gradient(145deg, #00632f, #00843d 55%, #00552b);
    color: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 18px 55px #0008;
    isolation: isolate;
}

/* TEXTURE */

#poster::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .10;
    background-image:
        radial-gradient(#fff 0.6px, transparent 0.8px);
    background-size: 5px 5px;
}

.frame {
    position: absolute;
    inset: 2.3mm;
    border: .35mm solid #ffffff55;
    border-radius: 2mm;
    pointer-events: none;
    z-index: 5;
}

/* DÉCORATIONS ORGE */

.botanical {
    position: absolute;
    width: 35mm;
    height: 55mm;
    opacity: .12;
    pointer-events: none;
    z-index: -1;
}

.botanical.left {
    left: -13mm;
    bottom: -12mm;
    transform: rotate(-25deg);
}

.botanical.right {
    right: -13mm;
    top: 18mm;
    transform: rotate(150deg);
}

/* EN-TÊTE */

.header {
    height: 22mm;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2mm 3mm;
    border-bottom: .45mm solid #ffffff70;
    position: relative;
}

.brand {
    width: 31mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.star {
    color: white;
    font-size: 27pt;
    line-height: .95;
    text-shadow: 0 1px 5px #0003;
}

.brand-name {
    font-family: Arial Black, Arial, sans-serif;
    font-size: 12pt;
    letter-spacing: -.5px;
    font-weight: 900;
}

.brand-rule {
    width: 25mm;
    height: .5mm;
    background: var(--red);
    margin-top: 1mm;
}

.heading {
    flex: 1;
    text-align: center;
}

.heading h1 {
    font-size: 17pt;
    line-height: 1.05;
    letter-spacing: -.5px;
    margin: 0;
    font-weight: 900;
    text-transform: uppercase;
}

.heading p {
    font-size: 7.5pt;
    margin: 2mm 0 0;
    font-weight: 700;
    letter-spacing: 1.1px;
    color: #e2eddf;
}

.header-mark {
    width: 22mm;
    text-align: right;
}

.header-mark span {
    display: inline-block;
    border: .3mm solid #ffffff70;
    border-radius: 2mm;
    padding: 2mm 2.5mm;
    font-size: 8pt;
    font-weight: 900;
    letter-spacing: .5px;
}

/* LÉGENDE */

.legend {
    height: 10mm;
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 1mm;
}

.legend-title {
    font-size: 8pt;
    font-weight: 900;
    letter-spacing: .8px;
}

.legend-note {
    font-size: 6.5pt;
    color: #dceade;
    font-weight: 600;
}

/* TABLEAU */

.schedule {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: 10mm repeat(6, 1fr);
    gap: 1.4mm;
    position: relative;
    z-index: 2;
}

.row {
    display: grid;
    grid-template-columns: 25mm repeat(3, 1fr);
    gap: 1.4mm;
    min-height: 0;
}

.cell {
    border-radius: 1.5mm;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* EN-TÊTES DES COLONNES */

.column-head {
    background: #003F23;
    border: .25mm solid #ffffff35;
    flex-direction: column;
    gap: 1mm;
    color: white;
}

.column-head strong {
    font-size: 9pt;
    letter-spacing: .5px;
}

.column-head small {
    font-size: 6pt;
    opacity: .8;
    font-weight: 600;
}

/* JOURS */

.day {
    background: #F0F5EF;
    color: var(--dark);
    flex-direction: column;
    gap: 1mm;
    border-left: 1mm solid var(--gold);
}

.day strong {
    font-size: 8.5pt;
    font-weight: 900;
    text-transform: uppercase;
}

.day small {
    font-size: 6pt;
    font-weight: 700;
    color: #718277;
}

/* CELLULES POSTES */

.post {
    background: #FAFCF9;
    color: var(--ink);
    border: .25mm solid #ffffffa0;
    flex-direction: column;
    gap: 1mm;
    position: relative;
}

.post.empty {
    background: #ffffff12;
    border: .25mm dashed #ffffff45;
}

.post.empty span {
    color: #ffffff65;
    font-size: 11pt;
}

.post strong {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 19pt;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.5px;
}

.post small {
    font-size: 6pt;
    line-height: 1.15;
    font-weight: 750;
    color: #64786B;
    text-transform: uppercase;
}

/* ACCENTS PAR ÉQUIPE */

.post.morning {
    border-bottom: 1mm solid #6BA9D1;
}

.post.afternoon {
    border-bottom: 1mm solid #D1A84D;
}

.post.night {
    border-bottom: 1mm solid #305C45;
}

.post.multi strong {
    font-size: 16pt;
}

/* DIMANCHE */

.row.sunday .day {
    background: #E5EEE5;
}

.row.sunday .post {
    background: #FFF8E8;
}

/* DIMANCHE NUIT : RESPONSABILITÉS INDIVIDUELLES */

.post.responsibility-list {
    background: #FFF5DB !important;
    border: .45mm solid var(--gold);
    padding: 1mm;
    gap: 1.5mm;
}

.responsibility-item {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .5mm;
}

.responsibility-item strong {
    font-size: 16pt;
    line-height: 1;
    color: #684B0A;
    font-weight: 950;
}

.responsibility-item small {
    font-size: 5.8pt;
    color: #826B38;
    font-weight: 850;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.15;
}

.responsibility-divider {
    width: 78%;
    height: .3mm;
    flex-shrink: 0;
    background: #D5B45B;
}

/* PIED DE PAGE */

.footer {
    height: 7mm;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 1mm;
    color: #e4eee5;
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .4px;
}

.footer .accent {
    color: var(--gold);
}

/* IMPRESSION */

@media print {
    @page {
        size: 150mm 150mm;
        margin: 0;
    }

    body {
        margin: 0;
        padding: 0;
        background: white;
    }

    .toolbar {
        display: none !important;
    }

    #poster {
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}

/* ADAPTATION ÉCRAN */

@media(max-width: 600px) {
    #poster {
        width: 95vw;
        height: 95vw;
        padding: 3.2vw;
    }

    .heading h1 {
        font-size: 3.2vw;
    }

    .brand-name {
        font-size: 2.4vw;
    }

    .post strong {
        font-size: 4.5vw;
    }

    .post.multi strong {
        font-size: 3.8vw;
    }

    .day strong {
        font-size: 2.2vw;
    }
}
</style>
</head>

<body>

<!-- BOUTON EXPORT -->

<div class="toolbar">
    <button onclick="downloadPNG()">
        ↓ Télécharger le planning PNG
    </button>
</div>

<!-- AFFICHE -->

<div id="poster">

    <div class="frame"></div>

    <!-- ORGE GAUCHE -->

    <svg class="botanical left"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>
        <path d="M45 175 Q80 135 105 143 Q85 175 45 175Z" fill="#F1D57D"/>

    </svg>

    <!-- ORGE DROITE -->

    <svg class="botanical right"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>

    </svg>

    <!-- EN-TÊTE -->

    <header class="header">

        <div class="brand">
            <div class="star">★</div>
            <div class="brand-name">HEINEKEN</div>
            <div class="brand-rule"></div>
        </div>

        <div class="heading">
            <h1>Planning de<br>nettoyage des postes</h1>
            <p>ORGANISATION HEBDOMADAIRE</p>
        </div>

        <div class="header-mark">
            <span>NETTOYAGE<br>POSTES</span>
        </div>

    </header>

    <!-- LÉGENDE -->

    <div class="legend">
        <span class="legend-title">RÉPARTITION DES POSTES</span>
        <span class="legend-note">Jours · Équipes · Postes</span>
    </div>

    <!-- TABLEAU GÉNÉRÉ PAR JAVASCRIPT -->

    <main class="schedule" id="schedule">

        <div class="row">

            <div class="cell column-head">
                <strong>JOUR</strong>
                <small>SEMAINE</small>
            </div>

            <div class="cell column-head">
                <strong>MATIN</strong>
                <small>ÉQUIPE MATIN</small>
            </div>

            <div class="cell column-head">
                <strong>APRÈS-MIDI</strong>
                <small>ÉQUIPE APRÈS-MIDI</small>
            </div>

            <div class="cell column-head">
                <strong>NUIT</strong>
                <small>ÉQUIPE NUIT</small>
            </div>

        </div>

    </main>

    <!-- PIED DE PAGE -->

    <footer class="footer">
        <span><span class="accent">★</span> HEINEKEN</span>
        <span>PLANNING DE NETTOYAGE</span>
    </footer>

</div>

<script>

/* =====================================================
   DONNÉES DU PLANNING
===================================================== */

const planning = [

    {
        day: "Dimanche",
        morning: [],
        afternoon: [],
        night: [
            {
                post: "1C",
                role: "ÉTIQUETEUR"
            },
            {
                post: "5C",
                role: "TECHNICIEN DE PRODUCTION"
            }
        ]
    },

    {
        day: "Lundi",
        morning: ["1A"],
        afternoon: ["1B"],
        night: ["2A"]
    },

    {
        day: "Mardi",
        morning: ["2B"],
        afternoon: ["3A"],
        night: ["3B"]
    },

    {
        day: "Mercredi",
        morning: ["4A", "4C"],
        afternoon: ["4B"],
        night: ["5A"]
    },

    {
        day: "Jeudi",
        morning: ["5B"],
        afternoon: ["6C"],
        night: ["6A"]
    },

    {
        day: "Vendredi",
        morning: ["6B"],
        afternoon: ["2C", "3C"],
        night: []
    }

];


/* =====================================================
   CONSTRUCTION DES CELLULES
===================================================== */

function createPostCell(posts, shift) {

    const cell = document.createElement("div");

    cell.className = `cell post ${shift}`;

    /* AUCUN POSTE */

    if (!posts || posts.length === 0) {

        cell.classList.add("empty");

        const empty = document.createElement("span");

        empty.textContent = "—";

        cell.appendChild(empty);

        return cell;
    }


    /* RESPONSABILITÉS INDIVIDUELLES */

    const hasRoles = posts.some(
        p => typeof p === "object"
    );

    if (hasRoles) {

        cell.classList.add("responsibility-list");

        posts.forEach((item, index) => {

            const post = document.createElement("div");

            post.className = "responsibility-item";

            const number = document.createElement("strong");

            number.textContent = item.post;

            const role = document.createElement("small");

            role.textContent = item.role;

            post.append(number, role);

            cell.appendChild(post);


            /* Séparation entre les responsabilités */

            if (index < posts.length - 1) {

                const separator = document.createElement("div");

                separator.className = "responsibility-divider";

                cell.appendChild(separator);

            }

        });

        return cell;
    }


    /* POSTES CLASSIQUES */

    if (posts.length > 1) {

        cell.classList.add("multi");

    }

    const strong = document.createElement("strong");

    strong.textContent = posts.join(" / ");

    cell.appendChild(strong);

    return cell;
}


/* =====================================================
   GÉNÉRATION DU TABLEAU
===================================================== */

const schedule = document.getElementById("schedule");

planning.forEach((item, index) => {

    const row = document.createElement("div");

    row.className = "row" + (
        index === 0 ? " sunday" : ""
    );


    /* JOUR */

    const day = document.createElement("div");

    day.className = "cell day";

    const dayName = document.createElement("strong");

    dayName.textContent = item.day;

    const daySub = document.createElement("small");

    daySub.textContent = "NETTOYAGE";

    day.append(dayName, daySub);

    row.appendChild(day);


    /* MATIN */

    row.appendChild(
        createPostCell(item.morning, "morning")
    );


    /* APRÈS-MIDI */

    row.appendChild(
        createPostCell(item.afternoon, "afternoon")
    );


    /* NUIT */

    row.appendChild(
        createPostCell(item.night, "night")
    );


    schedule.appendChild(row);

});


/* =====================================================
   EXPORT PNG HAUTE RÉSOLUTION
===================================================== */

async function downloadPNG() {

    const button = document.querySelector(".toolbar button");

    const oldText = button.textContent;

    button.disabled = true;

    button.textContent = "Génération en cours...";

    try {

        if (typeof html2canvas === "undefined") {

            throw new Error(
                "La bibliothèque d'export n'est pas chargée. Vérifiez votre connexion internet."
            );

        }

        const poster = document.getElementById("poster");

        const canvas = await html2canvas(poster, {

            scale: 3,

            backgroundColor: "#00632f",

            useCORS: true,

            logging: false,

            width: poster.offsetWidth,

            height: poster.offsetHeight

        });


        const link = document.createElement("a");

        link.download =
            "Planning_Nettoyage_Postes_Heineken.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    } catch (error) {

        alert(
            "Impossible de générer l'image : " + error.message
        );

    } finally {

        button.disabled = false;

        button.textContent = oldText;

    }

}

</script>

</body>
</html>
