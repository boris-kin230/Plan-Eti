
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heineken | Planning de nettoyage</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
    --green: #00843D;
    --dark: #00552B;
    --deep: #003B20;
    --red: #E32636;
    --gold: #D8B75B;
    --ink: #173B29;
    --muted: #718579;
    --white: #FFFFFF;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 12px;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 18px;
    background: #102C20;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* EXPORT */

.toolbar button {
    border: 0;
    border-radius: 30px;
    padding: 13px 25px;
    background: white;
    color: var(--dark);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 20px #0005;
    transition: .2s;
}

.toolbar button:hover {
    transform: translateY(-2px);
    background: #eaf5ed;
}

.toolbar button:disabled {
    opacity: .6;
    cursor: wait;
}

/* AFFICHE */

#poster {
    width: 150mm;
    height: 150mm;
    padding: 5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    isolation: isolate;
    color: white;

    background:
        radial-gradient(ellipse at 90% 5%, #ffffff17, transparent 28%),
        radial-gradient(ellipse at 5% 100%, #ffffff12, transparent 25%),
        linear-gradient(145deg, #00552B, #00843D 55%, #004C28);

    box-shadow: 0 18px 55px #0008;
}

#poster::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .08;
    background-image:
        radial-gradient(#fff .6px, transparent .8px);
    background-size: 5px 5px;
}

.frame {
    position: absolute;
    inset: 2.3mm;
    border: .35mm solid #ffffff55;
    border-radius: 2mm;
    pointer-events: none;
    z-index: 5;
}

/* DÉCORATIONS BOTANIQUES */

.botanical {
    position: absolute;
    width: 35mm;
    height: 55mm;
    opacity: .12;
    z-index: -1;
    pointer-events: none;
}

.botanical.left {
    left: -13mm;
    bottom: -12mm;
    transform: rotate(-25deg);
}

.botanical.right {
    right: -13mm;
    top: 18mm;
    transform: rotate(150deg);
}

/* HEADER */

.header {
    height: 22mm;
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 29mm 1fr 23mm;
    align-items: center;
    gap: 2mm;
    padding: 0 1mm 3mm;
    border-bottom: .45mm solid #ffffff70;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.star {
    font-size: 27pt;
    line-height: .9;
    color: white;
    text-shadow: 0 1px 5px #0003;
}

.brand-name {
    font-family: Arial Black, Arial, sans-serif;
    font-size: 11pt;
    font-weight: 900;
    letter-spacing: -.5px;
}

.brand-rule {
    width: 24mm;
    height: .5mm;
    background: var(--red);
    margin-top: 1mm;
}

.heading {
    text-align: center;
}

.heading h1 {
    margin: 0;
    font-size: 16pt;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: -.4px;
    text-transform: uppercase;
}

.heading p {
    margin: 2mm 0 0;
    font-size: 7pt;
    font-weight: 750;
    letter-spacing: 1.1px;
    color: #e2eddf;
}

.header-mark {
    text-align: right;
}

.header-mark span {
    display: inline-block;
    padding: 2mm;
    border: .3mm solid #ffffff70;
    border-radius: 2mm;
    font-size: 7pt;
    font-weight: 900;
    line-height: 1.4;
    letter-spacing: .4px;
}

/* INTRODUCTION */

.legend {
    height: 10mm;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 1mm;
}

.legend-title {
    font-size: 8pt;
    font-weight: 900;
    letter-spacing: .7px;
}

.legend-note {
    font-size: 6.5pt;
    color: #dceade;
    font-weight: 600;
}

/* TABLEAU */

.schedule {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: 10mm repeat(6, minmax(0, 1fr));
    gap: 1.4mm;
    position: relative;
    z-index: 2;
}

.row {
    display: grid;
    grid-template-columns: 25mm repeat(3, minmax(0, 1fr));
    gap: 1.4mm;
    min-height: 0;
}

.cell {
    min-width: 0;
    border-radius: 1.5mm;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* EN-TÊTES */

.column-head {
    background: #003F23;
    border: .25mm solid #ffffff35;
    flex-direction: column;
    gap: 1mm;
    color: white;
}

.column-head strong {
    font-size: 8.5pt;
    letter-spacing: .4px;
}

.column-head small {
    font-size: 5.8pt;
    opacity: .8;
    font-weight: 600;
}

/* JOURS */

.day {
    background: #F0F5EF;
    color: var(--dark);
    flex-direction: column;
    gap: 1mm;
    border-left: 1mm solid var(--gold);
}

.day strong {
    font-size: 8pt;
    font-weight: 900;
    text-transform: uppercase;
}

.day small {
    font-size: 5.7pt;
    font-weight: 700;
    color: var(--muted);
}

/* POSTES */

.post {
    background: #FAFCF9;
    color: var(--ink);
    border: .25mm solid #ffffffa0;
    position: relative;
    padding: 1mm;
    flex-direction: column;
    gap: 1mm;
}

.post strong {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 18pt;
    line-height: 1;
    font-weight: 900;
    letter-spacing: -.4px;
    white-space: nowrap;
}

.post small {
    font-size: 6pt;
    line-height: 1.15;
    font-weight: 750;
    color: var(--muted);
    text-transform: uppercase;
}

/* ACCENTS PAR ÉQUIPE */

.post.morning {
    border-bottom: 1mm solid #6BA9D1;
}

.post.afternoon {
    border-bottom: 1mm solid #D1A84D;
}

.post.night {
    border-bottom: 1mm solid #305C45;
}

/* PLUSIEURS POSTES */

.post.multi strong {
    font-size: 15pt;
}

/* DIMANCHE */

.row.sunday .day {
    background: #E5EEE5;
}

/* DIMANCHE NUIT : 1C / 5C (PGP) */

.post.sunday-night {
    background: #FFF5DB;
    border: .45mm solid var(--gold);
    border-bottom: 1mm solid #B99535;
    padding: 1mm;
}

.post.sunday-night strong {
    font-size: 13.5pt;
    color: #684B0A;
    letter-spacing: -.5px;
}

/* CELLULES VIDES */

.post.empty {
    background: #ffffff12;
    border: .25mm dashed #ffffff45;
}

.post.empty span {
    color: #ffffff65;
    font-size: 11pt;
}

/* FOOTER */

.footer {
    height: 7mm;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 1mm;
    color: #e4eee5;
    font-size: 6pt;
    font-weight: 700;
    letter-spacing: .4px;
}

.footer .accent {
    color: var(--gold);
}

/* IMPRESSION */

@media print {
    @page {
        size: 150mm 150mm;
        margin: 0;
    }

    body {
        margin: 0;
        padding: 0;
        background: white;
    }

    .toolbar {
        display: none !important;
    }

    #poster {
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}

/* ÉCRANS */

@media(max-width: 600px) {
    #poster {
        width: 95vw;
        height: 95vw;
        padding: 3.2vw;
    }

    .heading h1 {
        font-size: 3.2vw;
    }

    .brand-name {
        font-size: 2.4vw;
    }

    .post strong {
        font-size: 4.2vw;
    }

    .post.sunday-night strong {
        font-size: 3.1vw;
    }

    .day strong {
        font-size: 2.2vw;
    }
}
</style>
</head>

<body>

<div class="toolbar">
    <button onclick="downloadPNG()">
        ↓ Télécharger le planning PNG
    </button>
</div>

<div id="poster">

    <div class="frame"></div>

    <!-- ORGE GAUCHE -->

    <svg class="botanical left"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>
        <path d="M45 175 Q80 135 105 143 Q85 175 45 175Z" fill="#F1D57D"/>

    </svg>

    <!-- ORGE DROITE -->

    <svg class="botanical right"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>

    </svg>

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            <div class="star">★</div>
            <div class="brand-name">HEINEKEN</div>
            <div class="brand-rule"></div>
        </div>

        <div class="heading">
            <h1>Planning de<br>nettoyage des postes</h1>
        </div>

    </header>

    <!-- LÉGENDE -->

    <div class="legend">
        <span class="legend-note">Jours · Équipes · Postes</span>
    </div>

    <!-- PLANNING -->

    <main class="schedule" id="schedule">

        <div class="row">

            <div class="cell column-head">
                <strong>JOUR</strong>
                <small>SEMAINE</small>
            </div>

            <div class="cell column-head">
                <strong>MATIN</strong>
      
            </div>

            <div class="cell column-head">
                <strong>APRÈS-MIDI</strong>
           
            </div>

            <div class="cell column-head">
                <strong>NUIT</strong>
         
            </div>

        </div>

    </main>

</div>

<script>

/* ==============================================
   DONNÉES DU PLANNING
============================================== */

const planning = [

    {
        day: "Dimanche",
        morning: [],
        afternoon: [],
        night: ["1C / 5C (PGP)"]
    },

    {
        day: "Lundi",
        morning: ["1A"],
        afternoon: ["1B"],
        night: ["2A"]
    },

    {
        day: "Mardi",
        morning: ["2B"],
        afternoon: ["3A"],
        night: ["3B"]
    },

    {
        day: "Mercredi",
        morning: ["4A", "4C"],
        afternoon: ["4B"],
        night: ["5A"]
    },

    {
        day: "Jeudi",
        morning: ["5B"],
        afternoon: ["6C"],
        night: ["6A"]
    },

    {
        day: "Vendredi",
        morning: ["6B"],
        afternoon: ["2C", "3C"],
        night: []
    }

];


/* ==============================================
   CRÉATION DES CELLULES
============================================== */

function createPostCell(posts, shift, day) {

    const cell = document.createElement("div");

    cell.className = `cell post ${shift}`;

    /* Cellule vide */

    if (!posts || posts.length === 0) {

        cell.classList.add("empty");

        const empty = document.createElement("span");

        empty.textContent = "—";

        cell.appendChild(empty);

        return cell;
    }

    /* Dimanche nuit : présentation spécifique */

    if (day === "Dimanche" && shift === "night") {

        cell.classList.add("sunday-night");

        const strong = document.createElement("strong");

        strong.textContent = "1C / 5C(PGP)";

        cell.appendChild(strong);

        return cell;
    }

    /* Postes standards */

    if (posts.length > 1) {
        cell.classList.add("multi");
    }

    const strong = document.createElement("strong");

    strong.textContent = posts.join(" / ");

    cell.appendChild(strong);

    return cell;
}


/* ==============================================
   GÉNÉRATION DU TABLEAU
============================================== */

const schedule = document.getElementById("schedule");

planning.forEach((item, index) => {

    const row = document.createElement("div");

    row.className = "row" + (
        index === 0 ? " sunday" : ""
    );

    /* JOUR */

    const day = document.createElement("div");

    day.className = "cell day";

    const dayName = document.createElement("strong");

    dayName.textContent = item.day;

    const daySub = document.createElement("small");

    daySub.textContent = "NETTOYAGE";

    day.append(dayName, daySub);

    row.appendChild(day);

    /* MATIN */

    row.appendChild(
        createPostCell(item.morning, "morning", item.day)
    );

    /* APRÈS-MIDI */

    row.appendChild(
        createPostCell(item.afternoon, "afternoon", item.day)
    );

    /* NUIT */

    row.appendChild(
        createPostCell(item.night, "night", item.day)
    );

    schedule.appendChild(row);

});


/* ==============================================
   EXPORT PNG HAUTE RÉSOLUTION
============================================== */

async function downloadPNG() {

    const button = document.querySelector(".toolbar button");

    const oldText = button.textContent;

    button.disabled = true;

    button.textContent = "Génération en cours...";

    try {

        if (typeof html2canvas === "undefined") {
            throw new Error("Bibliothèque d'export non chargée. Vérifiez votre connexion.");
        }

        const poster = document.getElementById("poster");

        const canvas = await html2canvas(poster, {

            scale: 3,

            backgroundColor: "#00552B",

            useCORS: true,

            logging: false,

            width: poster.offsetWidth,

            height: poster.offsetHeight

        });

        const link = document.createElement("a");

        link.download = "Planning_Nettoyage_Postes_Heineken.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    } catch (error) {

        alert("Erreur lors de l'export : " + error.message);

    } finally {

        button.disabled = false;

        button.textContent = oldText;

    }

}

</script>

</body>
</html>
