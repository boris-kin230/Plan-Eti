<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heineken | Programmation PAL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root {
    --green: #00843D;
    --dark: #00552B;
    --deep: #003B20;
    --red: #E32636;
    --gold: #D8B75B;
    --ink: #173B29;
    --muted: #718579;
    --white: #FFFFFF;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 12px;
    display: flex;
    align-items: center;
    flex-direction: column;
    gap: 18px;
    background: #102C20;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* EXPORT */

.toolbar button {
    border: 0;
    border-radius: 30px;
    padding: 13px 25px;
    background: white;
    color: var(--dark);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 5px 20px #0005;
    transition: .2s;
}

.toolbar button:hover {
    transform: translateY(-2px);
    background: #eaf5ed;
}

.toolbar button:disabled {
    opacity: .6;
    cursor: wait;
}

/* AFFICHE */

#poster {
    width: 150mm;
    height: 150mm;
    padding: 5mm;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    isolation: isolate;
    color: white;

    background:
        radial-gradient(ellipse at 90% 5%, #ffffff17, transparent 28%),
        radial-gradient(ellipse at 5% 100%, #ffffff12, transparent 25%),
        linear-gradient(145deg, #00552B, #00843D 55%, #004C28);

    box-shadow: 0 18px 55px #0008;
}

#poster::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .08;
    background-image: radial-gradient(#fff .6px, transparent .8px);
    background-size: 5px 5px;
}

.frame {
    position: absolute;
    inset: 2.3mm;
    border: .35mm solid #ffffff55;
    border-radius: 2mm;
    pointer-events: none;
    z-index: 5;
}

/* DÉCORATIONS */

.botanical {
    position: absolute;
    width: 35mm;
    height: 55mm;
    opacity: .12;
    z-index: -1;
    pointer-events: none;
}

.botanical.left {
    left: -13mm;
    bottom: -12mm;
    transform: rotate(-25deg);
}

.botanical.right {
    right: -13mm;
    top: 18mm;
    transform: rotate(150deg);
}

/* HEADER */

.header {
    height: 25mm;
    flex-shrink: 0;
    display: grid;
    grid-template-columns: 29mm 1fr 23mm;
    align-items: center;
    gap: 2mm;
    padding: 0 1mm 3mm;
    border-bottom: .45mm solid #ffffff70;
}

.brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.star {
    font-size: 27pt;
    line-height: .9;
    color: white;
    text-shadow: 0 1px 5px #0003;
}

.brand-name {
    font-family: Arial Black, Arial, sans-serif;
    font-size: 11pt;
    font-weight: 900;
    letter-spacing: -.5px;
}

.brand-rule {
    width: 24mm;
    height: .5mm;
    background: var(--red);
    margin-top: 1mm;
}

.heading {
    text-align: center;
}

.heading h1 {
    margin: 0;
    font-size: 18pt;
    line-height: 1.1;
    font-weight: 900;
    letter-spacing: -.4px;
    text-transform: uppercase;
}

.header-mark {
    text-align: right;
}

.header-mark span {
    display: inline-block;
    padding: 2mm;
    border: .3mm solid #ffffff70;
    border-radius: 2mm;
    font-size: 9pt;
    font-weight: 900;
}

/* TABLEAU */

.schedule {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: 13mm repeat(6, minmax(0, 1fr));
    gap: 1.5mm;
    padding-top: 3mm;
    position: relative;
    z-index: 2;
}

.row {
    display: grid;
    grid-template-columns: 24mm 1fr 1.35fr;
    gap: 1.5mm;
    min-height: 0;
}

.cell {
    min-width: 0;
    border-radius: 1.5mm;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

/* EN-TÊTES */

.column-head {
    background: #003F23;
    border: .25mm solid #ffffff45;
    padding: 1mm;
}

.column-head strong {
    font-size: 7.5pt;
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: .2px;
}

/* JOURS */

.day {
    background: #F0F5EF;
    color: var(--dark);
    border-left: 1mm solid var(--gold);
}

.day strong {
    font-size: 8pt;
    font-weight: 900;
    text-transform: uppercase;
}

/* DONNÉES */

.data {
    background: #FAFCF9;
    color: var(--ink);
    border: .25mm solid #ffffffa0;
    border-bottom: 1mm solid #6BA9D1;
    padding: 1mm;
}

.data strong {
    font-family: "Arial Black", Arial, sans-serif;
    font-size: 19pt;
    line-height: 1.05;
    font-weight: 900;
}

.data.door {
    border-bottom-color: #D1A84D;
}

.data.door strong {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 10pt;
    line-height: 1.25;
    font-weight: 850;
}

.data.empty {
    background: #ffffff12;
    border: .25mm dashed #ffffff45;
}

.data.empty strong {
    color: #ffffff65;
    font-size: 11pt;
}

/* FOOTER */

.footer {
    height: 5mm;
    flex-shrink: 0;
}

/* IMPRESSION */

@media print {
    @page {
        size: 150mm 150mm;
        margin: 0;
    }

    body {
        margin: 0;
        padding: 0;
        background: white;
    }

    .toolbar {
        display: none !important;
    }

    #poster {
        box-shadow: none;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}

/* ÉCRANS */

@media(max-width: 600px) {
    #poster {
        width: 95vw;
        height: 95vw;
        padding: 3.2vw;
    }

    .heading h1 {
        font-size: 3.8vw;
    }

    .brand-name {
        font-size: 2.4vw;
    }

    .day strong {
        font-size: 2.2vw;
    }

    .column-head strong {
        font-size: 2vw;
    }

    .data strong {
        font-size: 4.5vw;
    }

    .data.door strong {
        font-size: 2.5vw;
    }
}
</style>
</head>

<body>

<div class="toolbar">
    <button onclick="downloadPNG()">
        ↓ Télécharger le planning PNG
    </button>
</div>

<div id="poster">

    <div class="frame"></div>

    <!-- ORGE GAUCHE -->
    <svg class="botanical left"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>
        <path d="M45 175 Q80 135 105 143 Q85 175 45 175Z" fill="#F1D57D"/>

    </svg>

    <!-- ORGE DROITE -->
    <svg class="botanical right"
         viewBox="0 0 150 240"
         xmlns="http://www.w3.org/2000/svg"
         fill="none"
         stroke="#F1D57D"
         stroke-width="3">

        <path d="M20 230 Q70 130 95 10"/>
        <path d="M53 145 Q15 120 15 95 Q50 100 53 145Z" fill="#F1D57D"/>
        <path d="M65 110 Q105 75 125 83 Q108 117 65 110Z" fill="#F1D57D"/>
        <path d="M77 73 Q48 42 58 20 Q83 36 77 73Z" fill="#F1D57D"/>
        <path d="M40 175 Q10 150 5 135 Q35 140 40 175Z" fill="#F1D57D"/>

    </svg>

    <!-- HEADER -->
    <header class="header">

        <div class="brand">
            <div class="star">★</div>
            <div class="brand-name">HEINEKEN</div>
            <div class="brand-rule"></div>
        </div>

        <div class="heading">
            <h1>Programmation<br>PAL</h1>
        </div>

        <div class="header-mark">
            <span>PAL</span>
        </div>

    </header>

    <!-- TABLEAU -->
    <main class="schedule" id="schedule">

        <div class="row">
            <div class="cell column-head">
                <strong>JOUR</strong>
            </div>

            <div class="cell column-head">
                <strong>BARRIÈRES<br>IMMATÉRIELLES</strong>
            </div>

            <div class="cell column-head">
                <strong>PORTES<br>D'ACCÈS</strong>
            </div>
        </div>

    </main>

    <div class="footer"></div>

</div>

<script>

/* DONNÉES DU PLANNING */

const planning = [
    {
        day: "Lundi",
        barrier: "N°4",
        door: ""
    },
    {
        day: "Mardi",
        barrier: "N°15",
        door: "Porte N°2 du P1"
    },
    {
        day: "Mercredi",
        barrier: "N°9",
        door: "Porte N°4 du P1"
    },
    {
        day: "Jeudi",
        barrier: "N°1",
        door: "Porte N°2 du MSK"
    },
    {
        day: "Vendredi",
        barrier: "N°12",
        door: "Porte N°4 du P3<br>et N°4 du MSK"
    },
    {
        day: "Samedi",
        barrier: "N°11",
        door: ""
    }
];


/* CRÉATION DES CELLULES */

const schedule = document.getElementById("schedule");

planning.forEach(item => {

    const row = document.createElement("div");
    row.className = "row";

    const day = document.createElement("div");
    day.className = "cell day";

    const dayName = document.createElement("strong");
    dayName.textContent = item.day;

    day.appendChild(dayName);
    row.appendChild(day);

    const barrier = document.createElement("div");
    barrier.className = "cell data";

    const barrierText = document.createElement("strong");
    barrierText.textContent = item.barrier;

    barrier.appendChild(barrierText);
    row.appendChild(barrier);

    const door = document.createElement("div");
    door.className = "cell data door";

    if (item.door) {
        const doorText = document.createElement("strong");
        doorText.innerHTML = item.door;
        door.appendChild(doorText);
    } else {
        door.classList.add("empty");

        const empty = document.createElement("strong");
        empty.textContent = "—";

        door.appendChild(empty);
    }

    row.appendChild(door);
    schedule.appendChild(row);

});


/* EXPORT PNG HAUTE RÉSOLUTION */

async function downloadPNG() {

    const button = document.querySelector(".toolbar button");
    const oldText = button.textContent;

    button.disabled = true;
    button.textContent = "Génération en cours...";

    try {

        if (typeof html2canvas === "undefined") {
            throw new Error("Bibliothèque d'export non chargée. Vérifiez votre connexion.");
        }

        const poster = document.getElementById("poster");

        const canvas = await html2canvas(poster, {
            scale: 3,
            backgroundColor: "#00552B",
            useCORS: true,
            logging: false,
            width: poster.offsetWidth,
            height: poster.offsetHeight
        });

        const link = document.createElement("a");

        link.download = "Programmation_PAL_Heineken.png";
        link.href = canvas.toDataURL("image/png");
        link.click();

    } catch (error) {

        alert("Erreur lors de l'export : " + error.message);

    } finally {

        button.disabled = false;
        button.textContent = oldText;

    }

}

</script>

</body>
</html>
